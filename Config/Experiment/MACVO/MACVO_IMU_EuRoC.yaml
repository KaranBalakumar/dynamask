Common:
  device: &device cuda
  max_depth: &max_depth auto

Odometry:
  name: MACVO_IMU
  args:
    device: *device
    edgewidth: 32
    num_point: 200
    match_cov_default: 0.25
    profile: false
    mapping: false

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_depth: *max_depth
      max_depth_cov: 250.0
      max_match_cov: 100.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./Model/MACVO_FrontendCov.pth
      enc_dtype: fp32
      dec_dtype: fp32
      decoder_depth: 12
      enforce_positive_disparity: false

  motion:
    type: TartanMotionNet
    args:
      weight: ./Model/MACVO_posenet.pkl
      device: *device

  outlier:
    type: FilterCompose
    args:
      filter_args:
        - type: CovarianceSanityFilter
          args:
        - type: SimpleDepthFilter
          args:
            min_depth: 0.05
            max_depth: *max_depth
        - type: LikelyFrontOfCamFilter
          args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  init:
    type: DRTLoose
    enabled: true
    min_keyframes: 10
    retry:
      max_attempts: 2
      window_scale: [1.0, 1.4, 1.8]
    fallback: heuristic
    gravity_norm: 9.81007
    # AirIO model for real-time velocity regression + EKF
    airio:
      ckpt: ./Model/AirIO_EuRoC/AirIO_checkpoint/best_model.ckpt
      propcov: true

  optimizer:
    type: TwoFrame_PGO
    args:
      device: cpu
      vectorize: true
      parallel: true
      graph_type: icp
      autodiff: false

Preprocess: []
