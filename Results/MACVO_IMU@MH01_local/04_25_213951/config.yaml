Data:
  args:
    args:
      gt_pose: true
      root: /home/karan/Downloads/EuRoC/machine_hall/MH_01_easy/MH_01_easy/mav0
    name: MH01_local
    type: EuRoC
  end_idx: 200
  start_idx: 0
Odometry:
  args:
    device: cuda
    edgewidth: 32
    mapping: false
    match_cov_default: 0.25
    num_point: 200
    profile: false
  cov:
    obs:
      args:
        device: cuda
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25
      type: MatchCovariance
  frontend:
    args:
      dec_dtype: fp32
      decoder_depth: 12
      device: cuda
      enc_dtype: fp32
      enforce_positive_disparity: false
      weight: ./Model/MACVO_FrontendCov.pth
    type: CUDAGraph_FlowFormerCovFrontend
  init:
    airio:
      ckpt: ./Model/AirIO_EuRoC/AirIO_checkpoint/best_model.ckpt
      propcov: true
    enabled: true
    fallback: heuristic
    gravity_norm: 9.81007
    min_keyframes: 10
    retry:
      max_attempts: 2
      window_scale:
      - 1.0
      - 1.4
      - 1.8
    type: DRTLoose
  keyframe:
    args: null
    type: AllKeyframe
  keypoint:
    args:
      device: cuda
      kernel_size: 7
      mask_width: 32
      max_depth: auto
      max_depth_cov: 250.0
      max_match_cov: 100.0
    type: CovAwareSelector
  mappoint:
    args:
      device: cuda
      mask_width: 32
      max_depth: 5.0
      max_depth_cov: 0.005
    type: MappingPointSelector
  motion:
    args:
      device: cuda
      weight: ./Model/MACVO_posenet.pkl
    type: TartanMotionNet
  name: MACVO_IMU
  optimizer:
    args:
      autodiff: false
      device: cpu
      graph_type: icp
      parallel: true
      vectorize: true
    type: TwoFrame_PGO
  outlier:
    args:
      filter_args:
      - args: null
        type: CovarianceSanityFilter
      - args:
          max_depth: auto
          min_depth: 0.05
        type: SimpleDepthFilter
      - args: null
        type: LikelyFrontOfCamFilter
    type: FilterCompose
  postprocess:
    args: null
    type: MotionInterpolate
Project: MACVO_IMU@MH01_local
