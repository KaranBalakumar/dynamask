model:
  frontend:
    type: StaticConfidence_FlowFormerCovFrontend
    args:
      weight: ./Model/MACVO_FrontendCov.pth
      device: cuda
      enc_dtype: bf16
      dec_dtype: fp16
      enforce_positive_disparity: true
      decoder_depth: 12
      imu:
        airimu_weights: ./Model/AirIMU_encoder.pth
        airimu_interval: 9
      dynamic_head:
        weight: null
        hidden_dim: 128
        recurrence: convgru
        imu_fusion: depth_bin_film
        imu_feature_dim: 128
        depth_bins: [0.0, 5.0, 20.0, 1.0e6]
        depth_bin_smooth: 0.5
        weight_mapper:
          num_knots: 8
          w_eps: 1.0e-3
        grad_clip: 0.01
        logit_clip: 10.0
        dt_reset_ms: 500

loss:
  static:
    enabled: true
    weight: 1.0
    focal_gamma: 2.0
    tau0: 1.0
    alpha: 1.0
    kappa: 2.0
  visible:
    enabled: true
    weight: 0.5
    tau_cyc_bce: 1.5
    kappa_cyc: 1.0
  joint:
    enabled: true
    weight: 0.2
  smooth:
    enabled: true
    weight: 0.05
  d_min: 0.5
  d_max: 80.0

train:
  window_len: 4
  stride: 4
  batch_size: 1
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  schedule: cosine
  total_steps: 50000
  grad_clip_norm: 1.0
  mixed_precision: bf16

odometry:
  dynamic_gating:
    enabled: true
    min_static_conf: 0.2

data:
  type: VIODE
  args:
    root: /data/viode/sequence_0001
    bag: sequence.bag
    cam0_calib: cam0_pinhole.yaml
    cam1_calib: cam1_pinhole.yaml
    calib: calibration.yaml
