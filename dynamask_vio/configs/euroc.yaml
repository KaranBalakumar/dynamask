# EuRoC MAV dataset-specific overrides

data:
  image_height: 480
  image_width: 752
  imu_rate_hz: 200
  camera_rate_hz: 20

# EuRoC camera intrinsics (cam0, from sensor.yaml)
camera:
  fx: 458.654
  fy: 457.296
  cx: 367.215
  cy: 248.375
  # Distortion (equidistant): [-0.28340811, 0.07395907, 0.00019359, 1.76187114e-05]

# Camera-to-IMU extrinsic (T_BS from EuRoC cam0 sensor.yaml)
extrinsics:
  T_CI: [[ 0.0148655,  -0.9999,     0.00745,    -0.0216401],
         [ 0.9999,      0.01497,    -0.00376,    -0.064677 ],
         [ 0.00386,     0.00741,     0.99997,     0.00981   ],
         [ 0.0,         0.0,         0.0,         1.0       ]]

# Train/val/test splits for IMU head pretraining
splits:
  train:
    - "MH_01_easy"
    - "MH_03_medium"
    - "MH_05_difficult"
    - "V1_02_medium"
    - "V2_01_easy"
    - "V2_03_difficult"
  val:
    - "MH_02_easy"
    - "V1_01_easy"
  test:
    - "MH_04_difficult"
    - "V1_03_difficult"
    - "V2_02_medium"

# EuRoC IMU noise parameters (from imu0/sensor.yaml)
imu_params:
  gyro_noise_density: 1.6968e-04      # rad/s/sqrt(Hz)
  gyro_random_walk: 1.9393e-05        # rad/s^2/sqrt(Hz)
  accel_noise_density: 2.0000e-03     # m/s^2/sqrt(Hz)
  accel_random_walk: 3.0000e-03       # m/s^3/sqrt(Hz)
