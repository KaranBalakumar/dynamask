# TartanAir V2 dataset-specific overrides

data:
  image_height: 480
  image_width: 640
  imu_rate_hz: 200
  camera_rate_hz: 25

# TartanAir camera intrinsics (default pinhole)
camera:
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0

# Environments with dynamic content
environments:
  - "Downtown"
  - "OldTown"
  - "Neighborhood"
  - "UrbanTree"
  - "AbandonedCable"

difficulties:
  - "easy"
  - "hard"

# TartanAir segmentation classes that are dynamic
segmentation:
  dynamic_class_ids: [6, 7, 8, 9, 10, 11]  # people, vehicles, animals (dataset-specific)

# TartanAir uses NED frame for poses
coordinate_frame: "NED"
