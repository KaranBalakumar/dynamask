Common:
  device: &device cuda

Odometry:
  name: MACVO-StaticConfidence
  args:
    device: *device
    edgewidth: 32
    num_point: 200
    match_cov_default: 0.25
    profile: false
    mapping: true
    dynamic_gating:
      enabled: true
      min_static_conf: 0.2

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: StaticConfidence_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./Model/MACVO_FrontendCov.pth
      enc_dtype: bf16
      dec_dtype: fp16
      decoder_depth: 12
      enforce_positive_disparity: true
      imu:
        airimu_weights: ./weights/airimu.pth
        airimu_interval: 9
        feature_dim: 128
        feature_hidden_dim: 128
      dynamic_head:
        weight: ./Model/StaticConfidenceHead/latest.pth
        hidden_dim: 128
        recurrence: convgru
        imu_fusion: depth_bin_film
        imu_feature_dim: 128
        grad_clip: 0.01
        logit_clip: 10.0
        dt_reset_ms: 500
        outputs: [static, visible]
        refinement:
          enabled: true
          res: h4
          width: 64
        proxy_input:
          enabled: true
          channels: [delta_f, r_imu, r_imu_norm, valid]
        depth_bins: [0.0, 5.0, 20.0, 1000000.0]
        weight_mapper:
          enabled: true
          type: monotonic_piecewise
          num_knots: 8
          w_eps: 1.0e-3

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: TwoFrame_PGO
    args:
      device: cpu
      vectorize: true
      parallel: true
      graph_type: reproj_imu
      autodiff: true

Data: !include ../../Sequence/EuRoC_MH01.yaml
Preprocess: !include ../Common/Preprocess.yaml
