model:
  frontend:
    type: StaticConfidence_FlowFormerCovFrontend
    args:
      weight: ./Model/MACVO_FrontendCov.pth
      device: cuda
      enc_dtype: bf16
      dec_dtype: fp16
      enforce_positive_disparity: true
      decoder_depth: 12
      imu:
        airimu_weights: ./weights/airimu.pth
        airimu_interval: 9
        feature_dim: 128
        feature_hidden_dim: 128
      dynamic_head:
        weight: null
        hidden_dim: 128
        recurrence: convgru
        imu_fusion: depth_bin_film
        imu_feature_dim: 128
        grad_clip: 0.01
        logit_clip: 10.0
        dt_reset_ms: 500
        outputs: [static, visible]
        refinement:
          enabled: true
          res: h4
          width: 64
        proxy_input:
          enabled: true
          channels: [delta_f, r_imu, r_imu_norm, valid]
        depth_bins: [0.0, 5.0, 20.0, 1000000.0]
        weight_mapper:
          enabled: true
          type: monotonic_piecewise
          num_knots: 8
          w_eps: 1.0e-3

loss:
  dyn:
    enabled: true
    weight: 1.0
    focal_gamma: 2.0
    tau0: 1.0
    alpha: 1.0
    kappa: 2.0
    d_min: 0.5
    d_max: 80.0
    tau_cyc_valid: 1.5
  smooth:
    enabled: true
    weight: 0.05
  cyc:
    enabled: true
    weight: 0.3
    tau_cyc_bce: 1.5
    kappa_cyc: 1.0
  static:
    enabled: true
    weight: 1.0
    focal_gamma: 2.0
    tau0: 1.0
    alpha: 1.0
    kappa: 2.0
  visible:
    enabled: true
    weight: 0.5
    tau_cyc_bce: 1.5
    kappa_cyc: 1.0
  joint:
    enabled: false
    weight: 0.2

train:
  window_len: 4
  batch_size: 1
  num_workers: 0
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  schedule: cosine
  grad_clip_norm: 1.0
  mixed_precision: bf16
  epochs: 10
  total_steps: 50000
  save_path: ./Model/StaticConfidenceHead/latest.pth

calibration:
  enabled: true
  optimizer_steps: 40
  temperature_min: 0.05
  temperature_max: 5.0

data:
  train:
    window_len: 4
    stride: 4
    imu_max_window_size: 128
    source:
      type: TartanAirv2
      args:
        root: /data/viode_rosbag_export/tartanair_v2_like
        compressed: true
        imu_freq: 100
        gtFlow: false
        gtDepth: false
        gtPose: true
        imu_sim:
          acc_bias: [0.02, -0.01, 0.05]
          acc_init_bias_noise: [0.01, 0.01, 0.01]
          acc_bias_instability: [0.000147, 0.000147, 0.000147]
          acc_random_walk: [1.96e-07, 1.96e-07, 1.96e-07]
          gyro_bias: [0.005, -0.002, 0.005]
          gyro_init_bias_noise: [0.01, 0.01, 0.01]
          gyro_bias_instability: [5.8e-06, 5.8e-06, 5.8e-06]
          gyro_random_walk: [3.8e-07, 3.8e-07, 3.8e-07]
  val:
    window_len: 4
    stride: 8
    imu_max_window_size: 128
    source:
      type: EuRoC
      args:
        root: /data/Euroc/MH_01_easy/mav0
        gt_pose: true

odometry:
  dynamic_gating:
    enabled: true
    min_static_conf: 0.2
